<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">

  <!-- Cryo-ET and subtomogram averaging in four steps, left to right:
       tilt series, tomogram, subtomograms, average.
       Colours as in welcome-graphic-placeholder.svg. -->

  <defs>
    <!-- A membrane protein in side view: large domain on top,
         transmembrane part below, membrane as a green line. -->
    <g id="particle">
      <line x1="-12" y1="4" x2="12" y2="4" stroke="#A7C947" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
      <rect x="-7" y="-9" width="14" height="10" rx="3" fill="#045C64"/>
      <rect x="-2.5" y="0" width="5" height="8" rx="1.5" fill="#4C979F"/>
    </g>
  </defs>

  <!-- Soft background circles -->
  <g fill="#4C979F" opacity=".10">
    <circle cx="80" cy="140" r="58"/>
    <circle cx="228" cy="142" r="62"/>
    <circle cx="375" cy="150" r="56"/>
    <circle cx="522" cy="146" r="62"/>
  </g>
  <g fill="#A7C947" opacity=".12">
    <circle cx="522" cy="146" r="42"/>
    <circle cx="150" cy="58" r="20"/>
    <circle cx="440" cy="250" r="18"/>
  </g>

  <!-- 1. Tilt series: electron beam, tilt range and a stack of 2D images -->
  <g stroke-linecap="round">
    <line x1="80" y1="34" x2="80" y2="60" stroke="#045C64" stroke-width="2"/>
    <path d="M74 54 L80 62 L86 54" stroke="#045C64" stroke-width="2" stroke-linejoin="round"/>
    <path d="M50.6 82 A34 34 0 0 1 109.4 82" stroke="#A7C947" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
  <g fill="#A7C947">
    <circle cx="50.6" cy="82" r="3.5"/>
    <circle cx="109.4" cy="82" r="3.5"/>
  </g>

  <g fill="#4C979F" fill-opacity=".08" stroke="#4C979F" stroke-opacity=".6" stroke-width="1.2">
    <rect width="64" height="48" rx="4" transform="translate(63 111) skewY(-12)"/>
    <rect width="64" height="48" rx="4" transform="translate(56 118) skewY(-12)"/>
    <rect width="64" height="48" rx="4" transform="translate(49 125) skewY(-12)"/>
  </g>
  <g transform="translate(42 132) skewY(-12)">
    <rect width="64" height="48" rx="4" fill="#ffffff" stroke="#045C64" stroke-width="1.4"/>
    <path d="M6 34 C20 24 36 40 58 28" stroke="#A7C947" stroke-width="1.8" stroke-linecap="round"/>
    <g fill="#4C979F" opacity=".6">
      <circle cx="12" cy="12" r="1.8"/>
      <circle cx="30" cy="16" r="1.8"/>
      <circle cx="50" cy="11" r="1.8"/>
      <circle cx="44" cy="42" r="1.8"/>
    </g>
    <g fill="#045C64">
      <circle cx="17" cy="28" r="2.8"/>
      <circle cx="33" cy="32" r="2.8"/>
      <circle cx="49" cy="30" r="2.8"/>
    </g>
  </g>

  <!-- 2. Tomogram: a 3D volume with a membrane and picked particles -->
  <polygon points="172,110 194,92 286,92 264,110" fill="#4C979F" fill-opacity=".16" stroke="#4C979F" stroke-opacity=".6" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="264,110 286,92 286,172 264,190" fill="#4C979F" fill-opacity=".24" stroke="#4C979F" stroke-opacity=".6" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="172" y="110" width="92" height="80" fill="#4C979F" fill-opacity=".07" stroke="#4C979F" stroke-opacity=".7" stroke-width="1.2"/>

  <g stroke="#A7C947" stroke-width="2" stroke-linecap="round">
    <path d="M180 166 C200 146 230 176 256 151"/>
    <path d="M180 172 C200 152 230 182 256 157" opacity=".5"/>
  </g>
  <g fill="#4C979F" opacity=".6">
    <circle cx="186" cy="124" r="2.5"/>
    <circle cx="212" cy="130" r="3"/>
    <circle cx="240" cy="122" r="2.5"/>
    <circle cx="190" cy="182" r="2.5"/>
    <circle cx="246" cy="180" r="2.5"/>
  </g>
  <g fill="#045C64">
    <circle cx="196" cy="152" r="4"/>
    <circle cx="219" cy="159" r="4"/>
    <circle cx="243" cy="156" r="4"/>
  </g>
  <g stroke="#045C64" stroke-opacity=".6" stroke-width="1.1" stroke-dasharray="2.5 2.5">
    <rect x="188" y="144" width="16" height="16" rx="2"/>
    <rect x="211" y="151" width="16" height="16" rx="2"/>
    <rect x="235" y="148" width="16" height="16" rx="2"/>
  </g>

  <!-- 3. Subtomograms: the same particle, cut out in different orientations -->
  <g fill="#4C979F" fill-opacity=".07" stroke="#4C979F" stroke-opacity=".6" stroke-width="1.1">
    <rect x="318" y="112" width="30" height="30" rx="3"/>
    <rect x="356" y="112" width="30" height="30" rx="3"/>
    <rect x="394" y="112" width="30" height="30" rx="3"/>
    <rect x="318" y="150" width="30" height="30" rx="3"/>
    <rect x="356" y="150" width="30" height="30" rx="3"/>
    <rect x="394" y="150" width="30" height="30" rx="3"/>
  </g>
  <use href="#particle" transform="translate(333 127) rotate(0)"/>
  <use href="#particle" transform="translate(371 127) rotate(40)"/>
  <use href="#particle" transform="translate(409 127) rotate(-55)"/>
  <use href="#particle" transform="translate(333 165) rotate(150)"/>
  <use href="#particle" transform="translate(371 165) rotate(-20)"/>
  <use href="#particle" transform="translate(409 165) rotate(95)"/>

  <!-- 4. Average: the aligned particles give one clear structure -->
  <g stroke="#A7C947" stroke-width="2.2" stroke-linecap="round">
    <line x1="470" y1="168" x2="575" y2="168"/>
    <line x1="470" y1="182" x2="575" y2="182" opacity=".6"/>
  </g>
  <rect x="494" y="102" width="56" height="50" rx="12" fill="#045C64" opacity=".92"/>
  <g fill="#4C979F" opacity=".75">
    <circle cx="508" cy="117" r="6.5"/>
    <circle cx="536" cy="117" r="6.5"/>
    <circle cx="508" cy="137" r="6.5"/>
    <circle cx="536" cy="137" r="6.5"/>
  </g>
  <rect x="509" y="150" width="26" height="40" rx="6" fill="#4C979F"/>
  <circle cx="522" cy="127" r="4" fill="#A7C947"/>

  <!-- Flow from step to step -->
  <g stroke-width="1.6" stroke-linecap="round">
    <path d="M118 150 C136 140 150 160 168 150" stroke="#4C979F" opacity=".6"/>
    <path d="M290 140 C300 132 306 148 314 141" stroke="#4C979F" opacity=".6"/>
    <path d="M428 146 C442 136 452 156 466 146" stroke="#A7C947" opacity=".9"/>
    <path d="M196 144 C250 52 430 50 500 98" stroke="#4C979F" opacity=".35"/>
  </g>


  <!-- Small accent nodes, as in the original graphic -->
  <g fill="#045C64">
    <circle cx="30" cy="60" r="4"/>
    <circle cx="575" cy="262" r="4.5"/>
  </g>
  <g fill="#4C979F">
    <circle cx="570" cy="58" r="5"/>
    <circle cx="300" cy="262" r="4"/>
  </g>
  <g fill="#A7C947">
    <circle cx="150" cy="58" r="5"/>
    <circle cx="440" cy="250" r="5"/>
  </g>

</svg>
