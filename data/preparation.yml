    # --------------------------------------------------
    # SECTION 4: Hardware requirements
    # --------------------------------------------------
    #
    # Use this section for computers or other equipment
    # participants need to bring or have access to.
    

    - title: "Hardware requirements"

      blocks:

        - type: hardware
          title: "Laptop"

          description: >
            Bring your own laptop (Windows, macOS or Linux) on which you
            can install software. All computing runs on the cluster.
