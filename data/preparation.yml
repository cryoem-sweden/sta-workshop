preparation:

# OPTIONAL 

  # This file contains what participants need to do or prepare before the
  # training, such as accounts, software and reading. It is shown on the
  # Preparation page, grouped in sections.

  # ==================================================
  # Leaving information out
  # ==================================================
  #
  # Every section and every block is optional. A block is only shown when
  # it has content, and a section is only shown when it has at least one
  # block with content.
  #
  # - To remove one block, delete it from its "- type:" line down to the
  #   line before the next "- type:".
  # - To remove a whole section, delete it from its "- title:" line down to
  #   the line before the next section's "- title:".
  # - A section title is optional: use title: "" for a section without a
  #   heading.
  # - To hide the whole Preparation page (also from the navbar and the
  #   quick links), empty or delete this file. A file with only the intro
  #   is also left out.

  # --------------------------------------------------
  # Page introduction
  # --------------------------------------------------

  intro: >
    The practical sessions run on the SciLifeLab cryo-EM cluster. You use your
    own laptop to log in to the cluster and to look at the results. Please
    install the programs below before the course.

  # --------------------------------------------------
  # Sections
  # --------------------------------------------------
  #
  # Add, remove, or rename sections to match the preparation
  # requirements for the training.

  sections:

    # --------------------------------------------------
    # SECTION 1: Checklist
    # --------------------------------------------------
    #
    # Use this section to provide a checklist of the main 
    # preparation tasks participants should complete before the training.

    - title: ""

      blocks:

        - type: checklist
          title: "Before the course"
          items:
            - "Windows: install MobaXterm. macOS and Linux: nothing to install for the cluster."
            - "Install ChimeraX 1.12 with ArtiaX and check that ArtiaX starts."
            - "Install 3dmod and open the test file golgi.mrc."
            - "Bring your laptop and its charger."


    # --------------------------------------------------
    # SECTION 2: Accounts
    # --------------------------------------------------
    #
    # Use this section to list any accounts participants need to 
    # create or access before the training. 

    - title: "Accounts"

      blocks:

        - type: account
          title: "Cluster account"

          description: >
            You work in groups. Each group gets an account on the cluster.

          instructions: |
            You get the user name and password at the start of the course.
            You do not need to create an account before.



    # --------------------------------------------------
    # SECTION 3: Software requirements
    # --------------------------------------------------
    #
    # Use this section for software participants need to
    # install, update, or configure before the training.

    
    - title: "Software requirements"

      blocks:

        - type: software
          title: "Cluster access"

          description: >
            One program for logging in to the cluster and for copying
            files to your laptop.

          instructions: |
            **macOS and Linux:** nothing to install. Use the Terminal:
            `ssh` to log in, `scp` to copy files.

            **Windows:** install MobaXterm (free Home Edition). It logs in
            with SSH and shows the cluster's files in a sidebar, where you
            can download them.

          links:
            - title: "MobaXterm (Home Edition) download"
              url: "https://mobaxterm.mobatek.net/download.html"
           
            - title: "Step-by-step guide with screenshots"
              url: "setup-guide.html"

        - type: software
          title: "ChimeraX with ArtiaX"

          description: >
            To look at tomograms, membranes and particle picks in 3D.

          instructions: |
            1. Install ChimeraX 1.12.
            2. Install the ArtiaX plugin from the ChimeraX Toolshed.

          links:
            - title: "ChimeraX download"
              url: "https://www.cgl.ucsf.edu/chimerax/download.html"

            - title: "Step-by-step guide with screenshots"
              url: "setup-guide.html"

        - type: software
          title: "3dmod (from IMOD)"

          description: >
            To look at tilt series, tomograms and particle picks.
            Version 5.x.

          instructions: |
            Windows: the standalone 3dmod is enough. macOS and Linux:
            install IMOD 5.x. See the step-by-step guide.

          links:
            - title: "3dmod for Windows"
              url: "https://bio3d.colorado.edu/ftp/Windows3dmod/"

            - title: "IMOD for macOS and Linux"
              url: "https://bio3d.colorado.edu/imod/download.html"
            
            - title: "Step-by-step guide with screenshots"
              url: "setup-guide.html"

        - type: callout
          style: note
          title: "Problems with the installation?"
          content: >
            Contact Gerrit Timpert (gerrit.timpert@scilifelab.se). If needed,
            we can also solve it together in a short Zoom call before the
            course.



