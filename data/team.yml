team:

# REQUIRED 

  # This file contains information about the training team
  # used throughout the website, including the Team page,
  # syllabus, and overview page team preview.
  #
  # Some fields are required and some are optional.
  #
  # The validator (validators.py) checks the required fields
  # and stops the website from rendering if any required
  # information is missing.

  # ==================================================
  # Team data rules
  # ==================================================

  # At least one team member is required.
  
  # Required fields for every team member:
    # - given_names (first name or names)
    # - family_names (surname, including e.g. "van der")
    # - roles
    # - affiliation
  
  # Allowed roles:
    # - Training lead
    # - Instructor
    # - Contributor
  
  # At least one team member must have:
    # - course_contact: true
    # - an email address
  
  # Training leads are optional.

  # On the overview page, up to two team members are shown:
    # 1. Training leads first.
    # 2. Instructors fill any remaining places.
    # 3. Contributors are not shown in the homepage preview.

  # Optional fields for team members:
    # - job_title
    # - email
    # - course_contact
    # - bio
    # - orcid
    # - linkedin
    # - github
    # - website
    # - image
    # - citation_author: whether this person is an author of the
    #   training. Set it to true to make them an author;
    #   set it to false if they are not.

    # Roles and authors are two different things:
    #   - "roles" says what someone did. It is shown on the website
    #     and in the README.
    #   - "citation_author" says whether they are an author. Only authors
    #     are named in the citation (CITATION.cff), and listed as
    #     "creators" on Zenodo. Everyone else is still shown on the
    #     website, and listed on Zenodo as "contributors".
    #   So a Contributor can be an author too: that is the default.


  # --------------------------------------------------
  # Page introduction
  # --------------------------------------------------

  intro: >
    Use this section to introduce the training team. Briefly
    describe who develops and delivers the training and the
    roles represented on the team.

  # --------------------------------------------------
  # Team members
  # --------------------------------------------------

  members:
  
    # --------------------------------------------------
    # Training leads
    # --------------------------------------------------
    #
    # Training leads are responsible for the overall
    # development, coordination, and delivery of the training.
    #
    # The "roles" value must contain "Training lead" for the
    # person to appear in the training-lead section.
    #
    # Training leads are shown first in the homepage team
    # preview, followed by instructors if fewer than two
    # training leads are available.

    - given_names: "Karin"
      family_names: "Walldén"
      roles:
        - Training lead
      affiliation: "Stockholm University"
      email: "karin.wallden@scilifelab.se"
      course_contact: true

    - given_names: "Marta"
      family_names: "Carroni"
      roles:
        - Training lead
      affiliation: "Stockholm University"
      email: "marta.carroni@scilifelab.se"

    - given_names: "Mathieu"
      family_names: "Coincon"
      roles:
        - Training lead
      affiliation: "Stockholm University"
      email: "mathieu.coincon@scilifelab.se"

    - given_names: "Gerrit"
      family_names: "Timpert"
      roles:
        - Training lead
      affiliation: "Stockholm University"
      email: "gerrit.timpert@scilifelab.se"

    - given_names: "Stavros"
      family_names: "Azinas"
      roles:
        - Training lead
      affiliation: "Stockholm University"
      email: "stavros.azinas@scilifelab.se"

    # --------------------------------------------------
    # Instructors
    # --------------------------------------------------
    #
    # Instructors teach, facilitate, or otherwise contribute
    # directly to the educational activities.
    #
    # Use the role "Instructor" to place a person in the
    # instructor section of the full Team page.

    - given_names: "Alberto"
      family_names: "Bartesaghi"
      roles:
        - Instructor
      affiliation: "Duke University, Durham, NC, USA"

    - given_names: "Misha"
      family_names: "Kudryashev"
      roles:
        - Instructor
      affiliation: "Max Delbrück Center for Molecular Medicine in the Helmholtz Association, Berlin"

    - given_names: "Anna"
      family_names: "Berdichevskaia"
      roles:
        - Instructor
      affiliation: "Helmholtz Zentrum München"

    - given_names: "Dimitry"
      family_names: "Tegunov"
      roles:
        - Instructor
      affiliation: "Genentech, South San Francisco, California"

    - given_names: "Veijo T. V."
      family_names: "Salo"
      roles:
        - Instructor
      affiliation: "Karolinska Institutet"

    # Add another instructor if applicable.


    # --------------------------------------------------
    # Contributors
    # --------------------------------------------------
    #
    # Contributors provide expertise, content, materials,
    # technical support, or other contributions to the training.
    #
    # Use the role "Contributor" to place a person in the
    # contributor section of the full Team page.

