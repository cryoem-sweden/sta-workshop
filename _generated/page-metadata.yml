pagetitle: Cryo-ET and Subtomogram averaging Workshop
description-meta: The focus of the workshop is to provide training in some of the most recent developments of CryoET and STA data processing using for instance **nextPYP**, **TomoBEAR**, **Warp/M**, taught by the developers themselves. The workshop provides hands-on training in CryoET and STA encompassing all stages of the pipeline. No previous experience is required. Participants are required to bring their own laptops with mouse to the workshop.
